name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations after deploying (pushes to main always do)'
        type: boolean
        default: true
      migration_path:
        description: 'Only run this migration file (e.g. database/migrations/2026_09_24_000001_create_transaction_shares_table.php). Empty = all pending.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, gd, curl, fileinfo, intl, openssl
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Built here so the shared host never has to run Composer. Scripts are skipped
      # because package discovery runs on the server (post-deploy.sh).
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Built here and uploaded with public/ (the server has no Node). The landing page needs
      # public/build/manifest.json because it uses Vite::asset() for its images.
      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          # Drop Windows line endings that sneak in when the key is pasted from Windows
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY is not a usable private key. Paste the ENTIRE private key file (from '-----BEGIN ... PRIVATE KEY-----' to '-----END ... PRIVATE KEY-----', on separate lines), created without a passphrase, in OpenSSH/PEM format (not .ppk, not the .pub file)."
            exit 1
          fi
          # Shared hosting often answers with different host keys from one connection to the
          # next (several servers behind one address), so scanning the key once and then
          # requiring a match fails at random. Without a pinned SSH_KNOWN_HOSTS secret the
          # host key is therefore not checked; authentication still needs the private key.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "SSH_HOSTKEY_OPTS=-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set - the server host key is not verified."
            echo "SSH_HOSTKEY_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR" >> "$GITHUB_ENV"
          fi

      - name: Upload files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH%/}" # a trailing slash in the secret is fine
          SSH_CMD="ssh -i $HOME/.ssh/id_deploy -p ${SSH_PORT:-22} -o BatchMode=yes $SSH_HOSTKEY_OPTS"
          DEST="$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          $SSH_CMD "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"

          # 1) Everything, without deleting anything (public_html may hold other things).
          rsync -rltz --chmod=D755,F644 --human-readable --stats \
            --exclude-from=.github/deploy-excludes.txt \
            -e "$SSH_CMD" ./ "$DEST"

          # 2) Directories owned by the app are mirrored exactly, so removed files disappear.
          rsync -rltz --chmod=D755,F644 --delete --relative \
            --exclude-from=.github/deploy-excludes.txt \
            -e "$SSH_CMD" ./app ./bootstrap ./config ./database ./public ./resources ./routes ./vendor "$DEST"

      - name: Post-deploy tasks
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PHP_BIN: ${{ vars.PHP_BIN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MIGRATE: ${{ inputs.run_migrations }}
          MIGRATION_PATH: ${{ inputs.migration_path }}
        run: |
          # Pushes to main always migrate; a manual run can opt out with the checkbox.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_MIGRATE" != "true" ]; then
            RUN_MIGRATIONS=false
          else
            RUN_MIGRATIONS=true
          fi
          ssh -i "$HOME/.ssh/id_deploy" -p "${SSH_PORT:-22}" -o BatchMode=yes $SSH_HOSTKEY_OPTS \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") PHP_BIN=$(printf %q "${PHP_BIN:-php}") RUN_MIGRATIONS=$(printf %q "$RUN_MIGRATIONS") MIGRATION_PATH=$(printf %q "$MIGRATION_PATH") bash -s" \
            < .github/scripts/post-deploy.sh

      - name: Health check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL variable not set - skipping health check."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL" || true)
            echo "Attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::$SITE_URL did not return HTTP 200 after the deploy."
          exit 1
