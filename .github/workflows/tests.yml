name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main] # main is tested by the Deploy workflow before it ships
  workflow_call:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, gd, curl, fileinfo, intl, openssl, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The landing page uses Vite::asset() for its images, so it needs public/build/manifest.json.
      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      # The tracked .env holds real credentials, so it must never be used here:
      # start from the example file and generate a throw-away key instead.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run tests
        run: php artisan test
